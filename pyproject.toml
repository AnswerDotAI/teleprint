[build-system]
requires = ["maturin>=1.13,<2.0", "fastws-cli>=0.0.29"]
build-backend = "fastws.build_backend"

[project]
name = "teleprint"
dynamic = ["version"]
description = "Keyed live transcripts in native terminal scrollback"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [{ name = "teleprint contributors" }]
classifiers = ["Programming Language :: Rust", "Programming Language :: Python :: Implementation :: CPython"]

[project.optional-dependencies]
dev = ["fastship", "pytest", "pyghostty"]

[project.urls]
Homepage = "https://github.com/AnswerDotAI/teleprint"

[tool.maturin]
manifest-path = "py/Cargo.toml"
python-source = "python"
module-name = "teleprint._core"

[tool.uv]
cache-keys = [{ file = "pyproject.toml" }, { file = "Cargo.toml" }, { file = "py/Cargo.toml" }]

[tool.pytest.ini_options]
testpaths = ["tests"]
