[workspace]
members = ["py"]
default-members = [".", "py"]

[workspace.package]
version = "0.1.12"
edition = "2024"

[package]
name = "teleprint"
version.workspace = true
edition.workspace = true
description = "Keyed live transcripts in native terminal scrollback"
license = "Apache-2.0"
repository = "https://github.com/AnswerDotAI/teleprint"
include = ["/src/", "/LICENSE", "/README.md"]

[lib]
test = false
doctest = false

[features]
tty = ["dep:crossterm", "dep:libc", "dep:tokio"]

[dependencies]
anstyle = "1"
base64 = "0.22"
crossterm = { version = "0.29", optional = true }
flate2 = "1"
libc = { version = "0.2", optional = true }
tokio = { version = "1.54", features = ["macros", "net", "signal"], optional = true }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
kitty-graphics-protocol = "0.1.3"
unicode-segmentation = "1"
unicode-width = "0.2"
vte = { version = "0.15", features = ["ansi"] }

[target.'cfg(unix)'.dev-dependencies]
ptymini = "0.0"
tokio = { version = "1", features = ["rt", "time"] }

[profile.test]
inherits = "release"

[profile.release]
lto = false
codegen-units = 16

[profile.release.package.teleprint]
incremental = true

[profile.release.package.teleprint-py]
incremental = true

[profile.dist]
inherits = "release"
lto = "thin"
incremental = false
strip = true

[profile.dist.package.teleprint]
incremental = false

[profile.dist.package.teleprint-py]
incremental = false
